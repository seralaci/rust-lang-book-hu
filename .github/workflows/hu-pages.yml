# A magyar fordítás buildelése és publikálása GitHub Pagesre.
#
# Egyszeri beállítás: Settings → Pages → Build and deployment → Source:
# „GitHub Actions”. A könyv ezután itt érhető el:
# https://seralaci.github.io/rust-lang-book-hu/
name: Magyar könyv publikálása

on:
  push:
    branches: [main]
    paths:
      - "src-hu/**"
      - "hu/**"
      - "packages/mdbook-trpl/**"
      - "theme/**"
      - "ferris.css"
      - "ferris.js"
      - ".github/workflows/hu-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hu-pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.99
          rustup default 1.99
      - name: Install mdbook
        run: |
          mkdir bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz --directory=bin
          echo "$(pwd)/bin" >> "${GITHUB_PATH}"
      - name: Build the Hungarian book
        run: mdbook build hu
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hu/book

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
